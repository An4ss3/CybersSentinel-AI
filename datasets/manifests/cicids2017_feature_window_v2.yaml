  schema_version: 2.0.0
  event_version: 2.0.0
  feature_version: 2.0.0
  sensor_version_source: inherited_from_source_events
feature_window_v1_status: preserved_unchanged

# ---------------------------------------------------------------------------
# Temporal policy (D2/D3, D5, D7, D12)
# ---------------------------------------------------------------------------
temporal:
  canonical_type: DECIMAL(38,22)
  json_encoding: fixed_scale_string_22_fractional_digits
  arithmetic: unscaled_integer
  float_conversion: forbidden
  rounding: forbidden
  truncation: forbidden
  datetime_conversion: forbidden
  timedelta_bounds: forbidden
  windowing_basis: event_start_time
  forbidden_windowing_fields: [ingested_at, record_available_time]
  prediction_time_rule: equals_window_end_time
  record_available_time_rule: inherited_from_source_events
  required_order: window_start_lt_window_end_le_prediction_le_record_available

# ---------------------------------------------------------------------------
# Window geometry (D5, D12, D13, D15)
# ---------------------------------------------------------------------------
window:
  type: tumbling
  length_seconds: '60.0000000000000000000000'
  slide_seconds: '60.0000000000000000000000'
  boundary_semantics: half_open_start_inclusive_end_exclusive
  alignment: floor_to_multiple_of_length_from_unix_epoch
  partition_policy: strictly_intra_partition
  cross_partition_windows: false
  empty_windows: forbidden
  overlapping_windows: false

# ---------------------------------------------------------------------------
# Entity policy (D6)
# ---------------------------------------------------------------------------
entity:
  entity_type: source_destination_service
  key_components: [source_ip, destination_ip, transport, service]
  key_encoding: ordered_tuple_of_strict_identifiers_one_element_per_component
  null_service_sentinel: none
  null_service_sentinel_collision_scope: verified_only_for_this_dataset_snapshot
  forbidden_entity_types: [sensor, custom]

# ---------------------------------------------------------------------------
# Authorized features (D11) — exactly eight, all integral counts or sums
# ---------------------------------------------------------------------------
features:
  count: 8
  container_type: mapping_of_strict_identifier_to_finite_float
  names:
  - destination_bytes_total
  - destination_packets_total
  - distinct_destination_ips
  - distinct_destination_ports
  - distinct_source_ips
  - event_count
  - source_bytes_total
  - source_packets_total
  definitions:
    event_count: cardinality_of_source_event_ids
    source_packets_total: sum_of_counters_source_packets
    destination_packets_total: sum_of_counters_destination_packets
    source_bytes_total: sum_of_counters_source_bytes
    destination_bytes_total: sum_of_counters_destination_bytes
    distinct_destination_ports: cardinality_of_distinct_destination_port
    distinct_destination_ips: cardinality_of_distinct_destination_ip
    distinct_source_ips: cardinality_of_distinct_source_ip
  forbidden:
  - rates_or_ratios
  - averages_requiring_division
  - normalized_features
  - scaled_features
  - learned_features
  - label_derived_features
  - attack_signatures
  - attack_specific_thresholds
  - target_variables
  - features_from_non_conn_zeek_logs

# ---------------------------------------------------------------------------
# Deterministic identity (D14, D6)
# ---------------------------------------------------------------------------
identity:
  algorithm: uuid5
  namespace: f787c08a-290e-5b79-a8cb-5bc19ae633dc
  namespace_derivation: uuid5_of_namespace_url_and_https_cybersentinel_local_m6_feature_window_v2
  components:
  - protocol_sha256
  - output_partition
  - entity_type
  - entity_key_components_in_declared_order
  - window_start_time
  - window_length_seconds
  name_encoding: utf8_component_values_joined_by_single_ascii_pipe
  window_id_rule: text_form_of_the_uuid5
  provenance_event_id_rule: same_uuid5_as_uuid
  random_identifiers: forbidden

# ---------------------------------------------------------------------------
