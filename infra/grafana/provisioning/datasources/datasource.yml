# Auto-provisioned PostgreSQL datasource for Grafana.
# Credentials are read from the container environment, populated by
# docker-compose.yml from the local .env file (see .env.example).
# Grafana expands $VAR references in provisioning files at startup.
apiVersion: 1

datasources:
  - name: PostgreSQL
    uid: cybersentinel-pg
    type: postgres
    access: proxy
    url: postgres:5432          # 'postgres' = compose service name
    user: $POSTGRES_USER
    isDefault: true
    editable: true
    secureJsonData:
      password: $POSTGRES_PASSWORD
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
